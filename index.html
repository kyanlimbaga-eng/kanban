<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flowboard is a fast, local-first kanban board with drag-and-drop cards, filters, and dark mode."
    />
    <meta name="theme-color" content="#f6f4ef" />
    <title>Flowboard — Kanban board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before React mounts to avoid a flash of the wrong theme.
      try {
        const stored = localStorage.getItem('flowboard.ui')
        const theme = stored ? JSON.parse(stored).state?.theme : null
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        // A corrupt or unavailable localStorage entry should fall back to light mode.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
